			<!-- Banner Here -->
			<div class="pgcontact-banner">
				<div class="container">
					<div class="pgcontact-banner-area">
						<div class="pgcontact-banner-left">
							<div class="pgcontact-banner-left-first">
								<img src="images/contact-heading.png" alt="">
							</div>
							<div class="pgcontact-banner-left-second">
								<img src="images/contact-items.png" alt="">
							</div>
						</div>
						<div class="pgcontact-banner-right">
							<div class="pgcontact-contact">
								<img src="images/form-heading.png" alt="">
								<form action="" class="pgcontact-contact-form">
									<div class="pgcontact-contact-form-devide">
										<div>
											<label for="name">Your name</label>
											<input type="text" id="name" placeholder="Your name" required>
										</div>
										<div>
											<label for="company">company <span>(optional)</span></label>
											<input type="text" id="company" placeholder="Company name">
										</div>
									</div>
									<div class="pgcontact-contact-form-devide">
										<div>
											<label for="email">Email Address</label>
											<input type="email" id="email" placeholder="you@example.com" required>
										</div>
										<div>
											<label for="phone">Phone Number</label>
											<input type="tel" id="phone" placeholder="e.g. 07812 345678">
										</div>
									</div>
									<div>
										<label for="massage">TELL US ABOUT YOUR PROJECT...</label>
										<textarea name="" id="massage" placeholder="What do you need help with? The more details, the better!"></textarea>
									</div>
									<div class="pgcontact-contact-form-button">
										<button type="submit"><img src="images/form-submit.png" alt=""></button>
									</div>
								</form>
							</div>
						</div>
						<div>
							<div class="pgcontact-banner-area-middle">
								<img src="images/formpage-monster.png" alt="">
							</div>
						</div>
					</div>
